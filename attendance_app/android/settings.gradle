include ':app'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

// Use Flutter's standard plugin loader. The SDK-root .flutter-plugin-registrant
// file is not a supported replacement for the Android Gradle plugin loader.
apply from: "$flutterRoot/packages/flutter_tools/gradle/app_plugin_loader.gradle"
