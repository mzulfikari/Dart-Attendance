publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  equatable: ^2.0.7
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  shamsi_date: ^1.1.1
